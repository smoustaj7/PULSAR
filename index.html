<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Astronaut health self-assessment for long-duration missions." />
    <meta name="theme-color" content="#061D24" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The body model is the biggest download. Start it now, alongside the app's code, rather
         than after the code has loaded and asked for it; low priority so it doesn't hold that code up. -->
    <link rel="preload" href="/models/astronaut.glb" as="fetch" type="model/gltf-binary" crossorigin fetchpriority="low" />
    <title>AstroPulse — Crew Health Monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
